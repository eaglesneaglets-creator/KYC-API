name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Real Postgres: row locks and the partial unique constraint are what
      # stop two reviewers deciding at once, and SQLite does not enforce them the same way.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kyc
          POSTGRES_PASSWORD: kyc
          POSTGRES_DB: kyc
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kyc" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://kyc:kyc@localhost:5432/kyc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest -p no:warnings
